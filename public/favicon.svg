<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#14b8a6" stroke-opacity="0.28" stroke-width="4" />

  <!-- 心電図グリッド線 -->
  <g stroke="#14b8a6" stroke-opacity="0.12" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" stroke-opacity="0.22" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" stroke-opacity="0.22" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- 上部インジケータ (LEAD II) -->
  <circle cx="92" cy="96" r="10" fill="#34d399" />
  <rect x="114" y="88" width="76" height="16" rx="8" fill="#14b8a6" fill-opacity="0.35" />

  <!-- 心電図 P-QRS-T 波形 (グロー背面) -->
  <path
    d="M 44 290 L 98 290 C 112 290 120 256 138 256 C 156 256 164 290 178 290 L 204 290 L 222 328 L 254 112 L 286 396 L 308 290 L 338 290 C 356 290 368 228 394 228 C 420 228 432 290 450 290 L 468 290"
    fill="none"
    stroke="#10b981"
    stroke-opacity="0.45"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- 心電図 P-QRS-T 波形 (メインライン) -->
  <path
    d="M 44 290 L 98 290 C 112 290 120 256 138 256 C 156 256 164 290 178 290 L 204 290 L 222 328 L 254 112 L 286 396 L 308 290 L 338 290 C 356 290 368 228 394 228 C 420 228 432 290 450 290 L 468 290"
    fill="none"
    stroke="url(#ecgGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 先端の輝点 -->
  <circle cx="468" cy="290" r="18" fill="#34d399" fill-opacity="0.35" />
  <circle cx="468" cy="290" r="10" fill="#a7f3d0" />
</svg>
